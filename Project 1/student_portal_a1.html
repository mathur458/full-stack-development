<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Result Management</title>
  <style>
    body {
  font-family: 'Times New Roman', Times, serif;
  background: #f3f4f8;
  margin: 0;
}

header {
  background: #a127ff;
  color: white;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
}

nav a {
  color: white;
  margin-left: 15px;
  text-decoration: none;
  font-weight: bold;
}

section {
  background: white;
  max-width: 600px;
  margin: 20px auto;
  padding: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

input, select {
  width: 100%;
  padding: 8px;
  box-sizing: border-box;
}

button {
  background: #a127ff;
  color: white;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
}

#resetBtn {
  background: gray;
}

.pass { color: green; font-weight: bold; }
.fail { color: red; font-weight: bold; }

@media (max-width: 600px) {
  section {
    margin: 10px;
    padding: 15px;
  }
}
  </style>
</head>
<body>

  <header>
    <h1>Student Portal</h1>
    <nav>
      <a href="#registration">Registration</a>
      <a href="#result">Result</a>
    </nav>
  </header>

  <section id="registration">
    <h2>Student Registration</h2>
    <form id="studentForm">
      <p>
        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter name">
      </p>
      <p>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email">
      </p>
      <p>
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="10 digit phone number" maxlength="10">
      </p>
      <p>
        <label for="course">Course</label>
        <select id="course">
          <option value="" selected disabled>Choose your course</option>
          <option>MCA</option>
          <option>MBA</option>
          <option>BBA</option>
          <option>B Tech CSE</option>
        </select>
      </p>
      <p>
        <label for="html">HTML Marks</label>
        <input type="number" id="html" placeholder="0 - 100">
      </p>
      <p>
        <label for="css">CSS Marks</label>
        <input type="number" id="css" placeholder="0 - 100">
      </p>
      <p>
        <label for="js">JavaScript Marks</label>
        <input type="number" id="js" placeholder="0 - 100">
      </p>
      <button type="submit">Generate Result</button>
      <button type="button" id="resetBtn">Reset</button>
    </form>
  </section>

  <section id="result">
    <h2>Result</h2>
    <div id="output"><p>No result generated yet.</p></div>
  </section>


  <script>
  document.getElementById("studentForm").addEventListener("submit", function (e) {
    e.preventDefault();

    // 1. Read the values
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var course = document.getElementById("course").value;
    var html = document.getElementById("html").value;
    var css = document.getElementById("css").value;
    var js = document.getElementById("js").value;

    // 2. Validate
    if (!/^[A-Za-z ]+$/.test(name)) {
      alert("Name should contain only letters");
      return;
    }
    if (!/^[A-Za-z0-9._-]+@[A-Za-z0-9-]+\.[A-Za-z.]+$/.test(email)) {
      alert("Enter a valid email");
      return;
    }
    if (!/^[0-9]{10}$/.test(phone)) {
      alert("Phone number must be 10 digits");
      return;
    }

    if (course === "") {
      alert("Please choose your course");
      return;
    }

    if (html === "" || css === "" || js === "") {
      alert("Enter all marks");
      return;
    }

    html = Number(html);
    css = Number(css);
    js = Number(js);

    if (html < 0 || html > 100 || css < 0 || css > 100 || js < 0 || js > 100) {
      alert("Marks must be between 0 and 100");
      return;
    }

    // 3. Calculate
    var total = html + css + js;
    var percentage = (total / 300) * 100;
    var result = "Pass";
    if (html < 40 || css < 40 || js < 40) {
      result = "Fail";
    }

    // 4. Display the result
    document.getElementById("output").innerHTML =
      "<p><b>Name:</b> " + name + "</p>" +
      "<p><b>Email:</b> " + email + "</p>" +
      "<p><b>Phone:</b> " + phone + "</p>" +
      "<p><b>Course:</b> " + course + "</p>" +
      "<p><b>HTML:</b> " + html + " | <b>CSS:</b> " + css + " | <b>JavaScript:</b> " + js + "</p>" +
      "<p><b>Total:</b> " + total + " / 300</p>" +
      "<p><b>Percentage:</b> " + percentage.toFixed(2) + "%</p>" +
      "<p class='" + result.toLowerCase() + "'><b>Result:</b> " + result + "</p>";

    // 5. Convert to JSON and store in Local Storage
    var student = {
      name: name,
      email: email,
      phone: phone,
      course: course,
      marks: { html: html, css: css, js: js },
      total: total,
      percentage: percentage.toFixed(2),
      result: result
    };

    localStorage.setItem("student", JSON.stringify(student));
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    document.getElementById("studentForm").reset();
    document.getElementById("output").innerHTML = "<p>No result generated yet.</p>";
  });
</script>

</body>
</html>
